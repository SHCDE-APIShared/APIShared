name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      historical_workshop_hotfix_audit:
        description: 'Audit the historical 0.9.2 hotfix scope against the published 0.9.0 tree'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Validate sources and metadata
        shell: pwsh
        run: ./tools/Validation/Test-Standalone.ps1 -SourceOnly
      - name: Run game-independent tests
        if: ${{ !cancelled() }}
        run: dotnet test tests/Core.Tests/Core.Tests.csproj --configuration Release --logger trx --results-directory TestResults
      - name: Qualify Core tests outside the checkout
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        shell: pwsh
        env:
          APISHARED_TEST_SOURCE_ROOT: ${{ github.workspace }}
          APISHARED_UPDATE_API_BASELINE: ''
          DOTNET_CLI_HOME: ${{ runner.temp }}/api-external-core/cli-home
          DOTNET_ADD_GLOBAL_TOOLS_TO_PATH: 'false'
          DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $checkout = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE).TrimEnd('\', '/')
          $work = [IO.Path]::GetFullPath((Join-Path $env:RUNNER_TEMP 'api-external-core'))
          $artifacts = Join-Path $work 'artifacts'
          $evidence = Join-Path $work 'evidence'
          if (Test-Path -LiteralPath $work) { throw "External qualification root must be fresh: $work" }
          function Test-Beneath([string] $Path, [string] $Root) {
            return [IO.Path]::GetFullPath($Path).StartsWith($Root.TrimEnd('\', '/') + [IO.Path]::DirectorySeparatorChar, [StringComparison]::OrdinalIgnoreCase)
          }
          if (Test-Beneath $work $checkout) { throw 'External output must be outside the checkout.' }
          function Get-SourcePins {
            foreach ($relative in @('APIShared.csproj', 'tests/Core.Tests/Core.Tests.csproj', 'tests/ApiBaseline/PublicApi.txt', 'tests/ApiBaseline/Content.PublicApi.txt', 'tests/ApiBaseline/ApiSignatures.cs', 'tests/Core.Tests/ApiBaselineRootTests.cs')) {
              $path = Join-Path $checkout $relative
              $file = Get-Item -LiteralPath $path
              if ($file.PSIsContainer -or $file.Length -le 0) { throw "Missing source input: $relative" }
              [ordered]@{ path = $relative; bytes = $file.Length; sha256 = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash }
            }
          }
          function Get-TrxAssembly([string] $Value) {
            if ([string]::IsNullOrWhiteSpace($Value)) { throw 'TRX omitted its test assembly path.' }
            if ($Value.StartsWith('file:', [StringComparison]::OrdinalIgnoreCase)) {
              $uri = [Uri]$Value
              if (-not $uri.IsFile) { throw 'TRX assembly URI must be a file URI.' }
              $Value = $uri.LocalPath
            }
            if (-not [IO.Path]::IsPathFullyQualified($Value)) { throw "TRX assembly path is not absolute: $Value" }
            return [IO.Path]::GetFullPath($Value)
          }
          $before = @(Get-SourcePins)
          $dotnet = (Get-Command dotnet -CommandType Application).Source
          $arguments = @('test', (Join-Path $checkout 'tests/Core.Tests/Core.Tests.csproj'), '--configuration', 'Release', '--artifacts-path', $artifacts, '--logger', 'trx;LogFileName=external-core.trx', '--logger', 'console;verbosity=minimal', '--results-directory', $evidence, '--verbosity', 'minimal', '--tl:off')
          New-Item -ItemType Directory -Path $evidence -Force | Out-Null
          $receipt = [ordered]@{
            schema = 'external-core-qualification/1'; status = 'FAILED'; commit = $env:GITHUB_SHA
            checkout = $checkout; artifacts = $artifacts; executable = $dotnet
            executableSha256 = (Get-FileHash -LiteralPath $dotnet -Algorithm SHA256).Hash
            arguments = $arguments; sourceRoot = $env:APISHARED_TEST_SOURCE_ROOT
            cliHome = $env:DOTNET_CLI_HOME; addGlobalToolsToPath = $env:DOTNET_ADD_GLOBAL_TOOLS_TO_PATH
            generateAspNetCertificate = $env:DOTNET_GENERATE_ASPNET_CERTIFICATE
            sourceBefore = $before; logByteLimit = 2MB; retainedLogBytes = 0; omittedLogRecords = 0
            nativeExit = $null; failure = $null
          }
          $failure = $null
          try {
            $writer = [IO.StreamWriter]::new((Join-Path $evidence 'run.log'), $false, [Text.UTF8Encoding]::new($false))
            try {
              # Drain every record; keep only the bounded prefix. Overflow fails qualification.
              & $dotnet @arguments 2>&1 | ForEach-Object {
                $line = [string]$_
                $length = [Text.Encoding]::UTF8.GetByteCount($line + $writer.NewLine)
                if ($receipt.omittedLogRecords -eq 0 -and $receipt.retainedLogBytes + $length -le $receipt.logByteLimit) {
                  $writer.WriteLine($line)
                  $receipt.retainedLogBytes += $length
                  Write-Host $line
                } else { $receipt.omittedLogRecords++ }
              }
              $receipt.nativeExit = $LASTEXITCODE
            } finally { $writer.Dispose() }
            if ($receipt.nativeExit -ne 0) { throw "External Core command exited $($receipt.nativeExit)." }
            if ($receipt.omittedLogRecords -gt 0) { throw 'External Core console output exceeded the retained log budget.' }
            $trx = Join-Path $evidence 'external-core.trx'
            [xml]$results = Get-Content -LiteralPath $trx -Raw
            $definitions = @($results.SelectNodes("/*[local-name()='TestRun']/*[local-name()='TestDefinitions']/*[local-name()='UnitTest']"))
            if ($definitions.Count -eq 0) { throw 'External TRX has no discovered test definitions.' }
            $assemblies = @($definitions | ForEach-Object {
              $storage = Get-TrxAssembly ($_.GetAttribute('storage'))
              $method = $_.SelectSingleNode("*[local-name()='TestMethod']")
              if ($null -eq $method -or (Get-TrxAssembly ($method.GetAttribute('codeBase'))) -ine $storage) { throw 'TRX source and method assembly paths disagree.' }
              $storage
            } | Sort-Object -Unique)
            if ($assemblies.Count -ne 1 -or [IO.Path]::GetFileName($assemblies[0]) -ine 'Core.Tests.dll') { throw 'External TRX must identify exactly the Core test assembly.' }
            $assembly = $assemblies[0]
            if (-not (Test-Beneath $assembly $artifacts) -or (Test-Beneath $assembly $checkout)) { throw 'TRX discovered a test DLL outside the external artifacts root or inside the checkout.' }
            $counters = $results.SelectSingleNode("/*[local-name()='TestRun']/*[local-name()='ResultSummary']/*[local-name()='Counters']")
            if ($null -eq $counters -or [int]$counters.GetAttribute('total') -le 0) { throw 'External TRX has no test count.' }
            $receipt.counters = [ordered]@{}
            foreach ($attribute in $counters.Attributes) { $receipt.counters[$attribute.Name] = $attribute.Value }
            if ([int]$counters.GetAttribute('failed') -ne 0 -or [int]$counters.GetAttribute('executed') -ne [int]$counters.GetAttribute('total') -or [int]$counters.GetAttribute('passed') -ne [int]$counters.GetAttribute('total')) { throw 'External Core tests were not all executed and passed.' }
            $receipt.testAssembly = [ordered]@{ path = $assembly; sha256 = (Get-FileHash -LiteralPath $assembly -Algorithm SHA256).Hash }
            $receipt.trxSha256 = (Get-FileHash -LiteralPath $trx -Algorithm SHA256).Hash
            $receipt.status = 'PASSED'
          } catch {
            $failure = $_
            $receipt.failure = $_.ToString()
          } finally {
            try {
              $receipt.sourceAfter = @(Get-SourcePins)
              $receipt.sourceUnchanged = ($before | ConvertTo-Json -Depth 4 -Compress) -ceq ($receipt.sourceAfter | ConvertTo-Json -Depth 4 -Compress)
              if (-not $receipt.sourceUnchanged) { throw 'Checkout source marker, helper, fixture or real baseline changed.' }
            } catch {
              $receipt.status = 'FAILED'
              $receipt.sourceVerificationFailure = $_.ToString()
              if ($null -eq $failure) { $failure = $_ }
            }
            $receipt | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath (Join-Path $evidence 'receipt.json') -Encoding utf8
          }
          if ($null -ne $failure) { throw $failure }
      - name: Retain external Core qualification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: external-core-qualification
          retention-days: 7
          path: |
            ${{ runner.temp }}/api-external-core/evidence/external-core.trx
            ${{ runner.temp }}/api-external-core/evidence/receipt.json
            ${{ runner.temp }}/api-external-core/evidence/run.log
      - name: Run Content contracts without game assemblies
        if: ${{ !cancelled() }}
        run: dotnet test tests/Content.Tests/Content.Tests.csproj --configuration Release --logger trx --results-directory TestResults
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: TestResults/*.trx
  workshop-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Workshop scope and shell policy
        shell: pwsh
        run: ./tools/Validation/Test-ShellScripts.ps1
      - name: Explicit historical Workshop hotfix audit
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.historical_workshop_hotfix_audit }}
        shell: pwsh
        run: ./tools/Validation/Test-WorkshopHotfixBoundaries.ps1
      - name: Managed recovery and maintenance with native Linux backend
        run: dotnet test tests/Core.Tests/Core.Tests.csproj --configuration Release --filter 'FullyQualifiedName~ProtonPathsTests|FullyQualifiedName~WorkshopMaintenancePlanTests|FullyQualifiedName~WorkshopMaintenanceRunnerTests|FullyQualifiedName~WorkshopRecoveryTests|FullyQualifiedName~WorkshopStartupTests|FullyQualifiedName~OpenUpdaterWriterDoesNotBreakTheHandoffAndPartialHashIsNotReady|FullyQualifiedName~MissingEmptyWrongAndTruncatedReadinessNeverConfirm' --logger trx --results-directory TestResults
      - name: Production Bash recovery including the user regression
        shell: pwsh
        run: ./tools/Validation/Test-WorkshopRecovery.ps1 -BackendSelection bash -Bash /usr/bin/bash -RequireBash
      - name: Native flock, process coordination and retention
        shell: bash
        run: |
          bash tools/Validation/test-workshop-updater.sh
          bash tools/Validation/test-workshop-restart.sh
          bash tools/Validation/test-workshop-coordination.sh
          bash tools/Validation/test-workshop-maintenance.sh
          mkdir -p .local/proton-shell
          TMPDIR="$PWD/.local/proton-shell" bash tools/Validation/test-proton-extender-updater.sh
      - name: Archive Proton shell evidence
        if: always()
        shell: bash
        run: |
          if [[ -d .local/proton-shell ]]; then
            # Preserve Linux names, symlinks and FIFOs behind an upload-safe filename.
            tar -cf proton-shell-evidence.tar -C .local proton-shell
            tar --compare -f proton-shell-evidence.tar -C .local
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: workshop-linux-evidence
          path: |
            proton-shell-evidence.tar
            TestResults/*.trx
            .local/recovery-tests/**/journal.log
