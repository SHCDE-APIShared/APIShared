name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      historical_workshop_hotfix_audit:
        description: 'Audit the historical 0.9.2 hotfix scope against the published 0.9.0 tree'
        type: boolean
        default: false
      public_extender_metadata_audit:
        description: 'Inspect selected metadata from the pinned official public Extender release (JSON only)'
        type: boolean
        default: false
      public_extender_metadata_fixture:
        description: 'Choose the fixed public-package metadata question set'
        type: choice
        default: baseline
        options:
          - baseline
          - preparation
          - reader-bindings
          - purchase-callbacks
permissions:
  contents: read
jobs:
  core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Validate sources and metadata
        shell: pwsh
        run: ./tools/Validation/Test-Standalone.ps1 -SourceOnly
      - name: Run game-independent tests
        if: ${{ !cancelled() }}
        run: dotnet test tests/Core.Tests/Core.Tests.csproj --configuration Release --logger trx --results-directory TestResults
      - name: Run Content contracts without game assemblies
        if: ${{ !cancelled() }}
        run: dotnet test tests/Content.Tests/Content.Tests.csproj --configuration Release --logger trx --results-directory TestResults
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: TestResults/*.trx
  workshop-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Workshop scope and shell policy
        shell: pwsh
        run: ./tools/Validation/Test-ShellScripts.ps1
      - name: Explicit historical Workshop hotfix audit
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.historical_workshop_hotfix_audit }}
        shell: pwsh
        run: ./tools/Validation/Test-WorkshopHotfixBoundaries.ps1
      - name: Managed recovery and maintenance with native Linux backend
        run: dotnet test tests/Core.Tests/Core.Tests.csproj --configuration Release --filter 'FullyQualifiedName~ProtonPathsTests|FullyQualifiedName~WorkshopMaintenancePlanTests|FullyQualifiedName~WorkshopMaintenanceRunnerTests|FullyQualifiedName~WorkshopRecoveryTests|FullyQualifiedName~WorkshopStartupTests|FullyQualifiedName~OpenUpdaterWriterDoesNotBreakTheHandoffAndPartialHashIsNotReady|FullyQualifiedName~MissingEmptyWrongAndTruncatedReadinessNeverConfirm' --logger trx --results-directory TestResults
      - name: Production Bash recovery including the user regression
        shell: pwsh
        run: ./tools/Validation/Test-WorkshopRecovery.ps1 -BackendSelection bash -Bash /usr/bin/bash -RequireBash
      - name: Native flock, process coordination and retention
        shell: bash
        run: |
          bash tools/Validation/test-workshop-updater.sh
          bash tools/Validation/test-workshop-restart.sh
          bash tools/Validation/test-workshop-coordination.sh
          bash tools/Validation/test-workshop-maintenance.sh
          mkdir -p .local/proton-shell
          TMPDIR="$PWD/.local/proton-shell" bash tools/Validation/test-proton-extender-updater.sh
      - name: Archive Proton shell evidence
        if: always()
        shell: bash
        run: |
          if [[ -d .local/proton-shell ]]; then
            # Preserve Linux names, symlinks and FIFOs behind an upload-safe filename.
            tar -cf proton-shell-evidence.tar -C .local proton-shell
            tar --compare -f proton-shell-evidence.tar -C .local
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: workshop-linux-evidence
          path: |
            proton-shell-evidence.tar
            TestResults/*.trx
            .local/recovery-tests/**/journal.log
  public-extender-metadata:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.public_extender_metadata_audit }}
    runs-on: windows-latest
    timeout-minutes: 8
    env:
      DOTNET_ADD_GLOBAL_TOOLS_TO_PATH: 'false'
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
      MSBUILDDISABLENODEREUSE: '1'
      PUBLIC_EXTENDER_METADATA_FIXTURE: ${{ inputs.public_extender_metadata_fixture || 'baseline' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Build portable metadata inspector
        shell: pwsh
        run: dotnet build tools/AssemblyMetadata/AssemblyMetadata.csproj --configuration Release --disable-build-servers --maxcpucount:2 -p:UseSharedCompilation=false --output "$env:RUNNER_TEMP/assembly-metadata-tool"
      - name: Audit pinned public Extender metadata
        shell: pwsh
        run: |
          $fixture = switch -CaseSensitive ($env:PUBLIC_EXTENDER_METADATA_FIXTURE) {
            'baseline' { './tools/Validation/PublicExtenderMetadata.2.14.4.json' }
            'preparation' { './tools/Validation/PublicExtenderPreparation.2.14.4.json' }
            'reader-bindings' { './tools/Validation/PublicReaderBindings.2.14.4.json' }
            'purchase-callbacks' { './tools/Validation/PublicPurchaseCallbacks.2.14.4.json' }
            default { throw 'Unsupported public metadata fixture.' }
          }
          ./tools/Validation/Invoke-PublicExtenderMetadataAudit.ps1 -FixturePath $fixture -ToolAssemblyPath "$env:RUNNER_TEMP/assembly-metadata-tool/AssemblyMetadata.dll" -WorkDirectory "$env:RUNNER_TEMP/public-extender-metadata-work" -OutputDirectory "$env:RUNNER_TEMP/public-extender-metadata-result"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: public-extender-metadata-${{ github.run_id }}
          path: ${{ runner.temp }}/public-extender-metadata-result/*.json
          if-no-files-found: error
          retention-days: 7
