name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      historical_workshop_hotfix_audit:
        description: 'Audit the historical 0.9.2 hotfix scope against the published 0.9.0 tree'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Validate sources and metadata
        shell: pwsh
        run: ./tools/Validation/Test-Standalone.ps1 -SourceOnly
      - name: Run game-independent tests
        if: ${{ !cancelled() }}
        run: dotnet test tests/Core.Tests/Core.Tests.csproj --configuration Release --logger trx --results-directory TestResults
      - name: Run Content contracts without game assemblies
        if: ${{ !cancelled() }}
        run: dotnet test tests/Content.Tests/Content.Tests.csproj --configuration Release --logger trx --results-directory TestResults
      - name: Exercise Content builds and artifact routing
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        shell: powershell
        env:
          DOTNET_ADD_GLOBAL_TOOLS_TO_PATH: 'false'
          DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          if (-not (Test-Path -LiteralPath $vswhere -PathType Leaf)) { throw 'Visual Studio discovery is unavailable.' }
          $msbuild = @(& $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find 'MSBuild/**/Bin/MSBuild.exe') | Select-Object -First 1
          if ($LASTEXITCODE -ne 0 -or -not $msbuild -or -not (Test-Path -LiteralPath $msbuild -PathType Leaf)) { throw 'Visual Studio MSBuild was not found.' }
          $fixture = Join-Path $env:RUNNER_TEMP 'api-content-build-fixture'
          if (Test-Path -LiteralPath $fixture) { throw 'Content fixture must be a fresh owned directory.' }
          [void][IO.Directory]::CreateDirectory($fixture)
          ./tools/Validation/Test-ContentBuild.ps1 -FixtureDirectory $fixture -MSBuild $msbuild
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: |
            TestResults/*.trx
            ${{ runner.temp }}/api-content-build-fixture/**
  workshop-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Workshop scope and shell policy
        shell: pwsh
        run: ./tools/Validation/Test-ShellScripts.ps1
      - name: Explicit historical Workshop hotfix audit
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.historical_workshop_hotfix_audit }}
        shell: pwsh
        run: ./tools/Validation/Test-WorkshopHotfixBoundaries.ps1
      - name: Safe Workshop installation on the native Linux file system
        run: dotnet test tests/Core.Tests/Core.Tests.csproj --configuration Release --filter 'FullyQualifiedName~ProtonPathsTests|FullyQualifiedName~WorkshopStartupTests|FullyQualifiedName~WorkshopLocalStateTests|FullyQualifiedName~WorkshopSafeInstallTests|FullyQualifiedName~WorkshopPackageTests' --logger trx --results-directory TestResults
      - name: Proton Extender updater shell fixture
        shell: bash
        run: |
          mkdir -p .local/proton-shell
          TMPDIR="$PWD/.local/proton-shell" bash tools/Validation/test-proton-extender-updater.sh
      - name: Archive Proton shell evidence
        if: always()
        shell: bash
        run: |
          if [[ -d .local/proton-shell ]]; then
            # Preserve Linux names, symlinks and FIFOs behind an upload-safe filename.
            tar -cf proton-shell-evidence.tar -C .local proton-shell
            tar --compare -f proton-shell-evidence.tar -C .local
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: workshop-linux-evidence
          path: |
            proton-shell-evidence.tar
            TestResults/*.trx
