name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      historical_workshop_hotfix_audit:
        description: 'Audit the historical 0.9.2 hotfix scope against the published 0.9.0 tree'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Validate sources and metadata
        shell: pwsh
        run: ./tools/Validation/Test-Standalone.ps1 -SourceOnly
      - name: Run game-independent tests
        if: ${{ !cancelled() }}
        run: dotnet test tests/Core.Tests/Core.Tests.csproj --configuration Release --logger trx --results-directory TestResults
      - name: Run Content contracts without game assemblies
        if: ${{ !cancelled() }}
        run: dotnet test tests/Content.Tests/Content.Tests.csproj --configuration Release --logger trx --results-directory TestResults
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: TestResults/*.trx
  workshop-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Workshop scope and shell policy
        shell: pwsh
        run: ./tools/Validation/Test-ShellScripts.ps1
      - name: Explicit historical Workshop hotfix audit
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.historical_workshop_hotfix_audit }}
        shell: pwsh
        run: ./tools/Validation/Test-WorkshopHotfixBoundaries.ps1
      - name: Managed recovery and maintenance with native Linux backend
        run: dotnet test tests/Core.Tests/Core.Tests.csproj --configuration Release --filter 'FullyQualifiedName~WorkshopMaintenancePlanTests|FullyQualifiedName~WorkshopMaintenanceRunnerTests|FullyQualifiedName~WorkshopRecoveryTests|FullyQualifiedName~WorkshopStartupTests|FullyQualifiedName~OpenUpdaterWriterDoesNotBreakTheHandoffAndPartialHashIsNotReady|FullyQualifiedName~MissingEmptyWrongAndTruncatedReadinessNeverConfirm' --logger trx --results-directory TestResults
      - name: Production Bash recovery including the user regression
        shell: pwsh
        run: ./tools/Validation/Test-WorkshopRecovery.ps1 -BackendSelection bash -Bash /usr/bin/bash -RequireBash
      - name: Native flock, process coordination and retention
        shell: bash
        run: |
          bash tools/Validation/test-workshop-updater.sh
          bash tools/Validation/test-workshop-restart.sh
          bash tools/Validation/test-workshop-coordination.sh
          bash tools/Validation/test-workshop-maintenance.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: workshop-linux-evidence
          path: |
            TestResults/*.trx
            .local/recovery-tests/**/journal.log
